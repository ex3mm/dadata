---
name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  standalone:
    name: standalone (PHP ${{ matrix.php }}, Guzzle ${{ matrix.guzzle }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        guzzle: ['7.16.3', '^7.16.3', '8.5.2', '^8.5.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-publish --no-check-version
      - name: Select PHP platform
        run: composer config platform.php '${{ matrix.php }}'
      # Laravel development dependencies constrain Guzzle; test standalone support independently.
      - name: Remove Laravel development dependencies
        run: composer remove --dev orchestra/testbench illuminate/support illuminate/contracts --no-update --no-interaction
      - name: Select Guzzle version
        run: composer require 'guzzlehttp/guzzle:${{ matrix.guzzle }}' --no-update --no-interaction
      - run: composer update --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testsuite Unit --no-coverage
      - run: composer audit --no-dev

  laravel:
    name: Laravel ${{ matrix.laravel }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.12'
            illuminate: '^12.0'
          - laravel: '13'
            testbench: '^11.3'
            illuminate: '^13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-publish --no-check-version
      - name: Select PHP platform
        run: composer config platform.php '${{ matrix.php }}'
      - name: Select Laravel version
        run: >-
          composer require --dev
          'orchestra/testbench:${{ matrix.testbench }}'
          'illuminate/support:${{ matrix.illuminate }}'
          'illuminate/contracts:${{ matrix.illuminate }}'
          --no-update --no-interaction
      - run: composer update --with-all-dependencies --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testsuite Laravel --no-coverage
      - run: composer audit

  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [phpstan, rector, 'cs:check']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-publish --no-check-version
      - run: composer install --no-interaction --prefer-dist
      - name: Run ${{ matrix.check }}
        run: composer run-script --no-interaction "${{ matrix.check }}"
